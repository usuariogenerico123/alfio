services:
  postgres:
    image: postgres:16-alpine
    container_name: alfio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-alfio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alfio_secret}
      POSTGRES_DB: ${DB_NAME:-alfio_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - alfio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alfio} -d ${DB_NAME:-alfio_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  alfio_pgdata:
